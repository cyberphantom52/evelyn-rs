[book]
title = "Evelyn Guide"
description = "Porting Android ROMs to devices with Evelyn"
authors = ["Inam Ul Haq"]
language = "en"
src = "src"

[build]
build-dir = "build"

[output.html]
git-repository-url = "https://github.com/cyberphantom52/evelyn-rs"
