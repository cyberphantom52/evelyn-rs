[workspace]
members = ["crates/*"]
default-members = ["crates/evelyn"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.dependencies]
android = { path = "crates/android" }
thiserror = "2.0.21"
pest = "2.9.5"
pest_derive = "2.9.5"
smali = { path = "crates/smali" }
apkscope-core = { git = "https://github.com/suffixing/apkscope", rev = "9b3de35573c90cc7587699bbd270ea62aa732d0d" }
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
regex = "1.13.1"
ron = "0.12.2"
toml = "1.1.8"
sha2 = "0.11.1"
fs-core = { package = "rust-fs-core", version = "0.4.4" }
fs-ext4 = { package = "rust-fs-ext4", git = "https://github.com/cyberphantom52/rust-fs-ext4", rev = "91677a6bd9535bef4bace45b5f08172f1a1e8164" }
sepolicy = { package = "sepolicy-inject-rs", git = "https://github.com/cyberphantom52/sepolicy-inject-rs", rev = "dc66735cf18ec14ee59f4605831408f77a796425" }
fs-erofs = { package = "rust-fs-erofs", version = "0.6.0" }
payload-dumper = { package = "payload_dumper", git = "https://github.com/cyberphantom52/payload-dumper-rust", rev = "321585db553c93367f0f4d7005fa79a163d4c95a", default-features = false, features = ["local_zip", "remote_zip", "prefetch"] }
tokio = { version = "1.53", default-features = false, features = ["rt-multi-thread"] }
diffy = "0.5.2"
xot = "0.31.2"
tracing = "0.1.44"
ureq = "3.5.0"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring", "pem"] }
rsa = "0.9.10"
rand = "0.8.5"
dirs = "7.0.0"
zip = { version = "9.0.5", default-features = false }
zstd = { version = "0.14.3", default-features = false, features = ["zstdmt"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt", "env-filter"] }

# The rust-fs-ext4 fork depends on rust-fs-core by a path outside its own repository.
[patch."https://github.com/cyberphantom52/rust-fs-ext4"]
rust-fs-core = { version = "=0.4.4" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
