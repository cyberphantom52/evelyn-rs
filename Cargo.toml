[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.dependencies]
android-fs = { path = "crates/android-fs" }
android-property = { path = "crates/android-property" }
model = { path = "crates/model" }
patch = { path = "crates/patch" }
recipe = { path = "crates/recipe" }
toolchain = { path = "crates/toolchain" }
thiserror = "2.0.21"
pest = "2.9.4"
pest_derive = "2.9.4"
smali = { path = "crates/smali" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ron = "0.12.2"
toml = "1.1.8"
sha2 = "0.11.1"
fs-core = { package = "rust-fs-core", version = "0.3.17" }
fs-ext4 = { package = "rust-fs-ext4", version = "0.8.0" }
tar = { version = "0.4.46", default-features = false }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
percent-encoding = "2.3.2"
diffy = "0.5.2"
xot = "0.31.2"
tracing = "0.1.44"
zip = { version = "9.0.5", default-features = false }
zstd = { version = "0.14.3", default-features = false, features = ["zstdmt"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
