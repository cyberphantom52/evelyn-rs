[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.dependencies]
thiserror = "2.0.21"
pest = "2.9.4"
pest_derive = "2.9.4"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
tracing = "0.1.44"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
