[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.dependencies]
model = { path = "crates/model" }
thiserror = "2.0.21"
pest = "2.9.4"
pest_derive = "2.9.4"
serde = { version = "1.0.229", features = ["derive"] }
ron = "0.12.2"
toml = "1.1.8"
sha2 = "0.11.1"
fs-core = { package = "rust-fs-core", version = "0.3.17" }
tracing = "0.1.44"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
