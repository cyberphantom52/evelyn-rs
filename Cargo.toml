[workspace]
members = ["crates/*"]
default-members = ["crates/cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.dependencies]
android-fs = { path = "crates/android-fs" }
android-property = { path = "crates/android-property" }
engine = { package = "evelyn-engine", path = "crates/evelyn-engine" }
model = { path = "crates/model" }
patch = { package = "evelyn-patch", path = "crates/evelyn-patch" }
recipe = { package = "evelyn-recipe", path = "crates/evelyn-recipe" }
toolchain = { path = "crates/toolchain" }
thiserror = "2.0.21"
pest = "2.9.4"
pest_derive = "2.9.4"
smali = { path = "crates/smali" }
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
regex = "1.13.1"
ron = "0.12.2"
toml = "1.1.8"
sha2 = "0.11.1"
fs-core = { package = "rust-fs-core", version = "0.4.2" }
fs-ext4 = { package = "rust-fs-ext4", git = "https://github.com/cyberphantom52/rust-fs-ext4", rev = "91677a6bd9535bef4bace45b5f08172f1a1e8164" }
fs-erofs = { package = "rust-fs-erofs", git = "https://github.com/cyberphantom52/rust-fs-erofs", rev = "88a3858f1d0f1f9b58ac2443c48fa935c55c1da6" }
diffy = "0.5.2"
xot = "0.31.2"
tracing = "0.1.44"
zip = { version = "9.0.5", default-features = false }
zstd = { version = "0.14.3", default-features = false, features = ["zstdmt"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt", "env-filter"] }

# The rust-fs crates depend on rust-fs-core by a path outside their own repositories.
[patch."https://github.com/cyberphantom52/rust-fs-ext4"]
rust-fs-core = { version = "0.4.2" }

[patch."https://github.com/cyberphantom52/rust-fs-erofs"]
rust-fs-core = { version = "0.4.2" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
