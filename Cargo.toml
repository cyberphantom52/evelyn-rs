[workspace]
members = ["crates/*"]
default-members = ["crates/evelyn"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

[workspace.dependencies]
android = { path = "crates/android" }
thiserror = "2.0.21"
apkscope-core = { git = "https://github.com/cyberphantom52/apkscope", rev = "f52a1b349a68b88944167d575f99c9ebe0032db9" }
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
regex = "1.13.1"
ron = "0.12.2"
toml = "1.1.8"
sha2 = "0.11.1"
base64 = "0.23.1"
fs-core = { package = "rust-fs-core", version = "0.4.4" }
fs-ext4 = { package = "rust-fs-ext4", git = "https://github.com/cyberphantom52/rust-fs-ext4", rev = "91677a6bd9535bef4bace45b5f08172f1a1e8164" }
sepolicy = { package = "sepolicy-inject-rs", git = "https://github.com/cyberphantom52/sepolicy-inject-rs", tag = "v0.5.0" }
fs-erofs = { package = "rust-fs-erofs", git = "https://github.com/cyberphantom52/rust-fs-erofs", rev = "2025152b8d51d0d3151a7942b26b433ff7e31114" }
bootimg = { git = "https://github.com/cyberphantom52/bootimg", rev = "40dad8a578ae5beecfb54c74664583b060bc7736", default-features = false }
payload-dumper = { package = "payload_dumper", git = "https://github.com/cyberphantom52/payload-dumper-rust", rev = "4eb9a3efac805c22632d04f6a350a4ca31bd8588", default-features = false, features = ["local_zip", "remote_zip", "prefetch"] }
tokio = { version = "1.53", default-features = false, features = ["rt-multi-thread"] }
diffy = "0.5.2"
xot = "0.31.2"
tracing = "0.1.44"
ureq = "3.5.0"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring", "pem"] }
rsa = "0.9.10"
rand = "0.8.5"
dirs = "7.0.0"
zip = { version = "9.0.5", default-features = false }
zstd = { version = "0.14.3", default-features = false, features = ["zstdmt"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt", "env-filter"] }

# The rust-fs-ext4 and rust-fs-erofs forks depend on rust-fs-core by a path outside
# their own repositories.
[patch."https://github.com/cyberphantom52/rust-fs-ext4"]
rust-fs-core = { version = "=0.4.4" }

[patch."https://github.com/cyberphantom52/rust-fs-erofs"]
rust-fs-core = { version = "=0.4.4" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# Dependencies are built without debug info, which keeps the debug build small;
# the workspace crates keep theirs.
[profile.dev.package."*"]
debug = false

[profile.release]
strip = true
lto = true
codegen-units = 1
